<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- Top Bar -->
        <header class="topbar">

            <div class="topbar-top">

                <div class="logo">
                    <h2>Nexus</h2>
                </div>

                <div class="topbar-right">

                    <a href="../../student-dashboard/html/index.html" class="student-link">
                        <i class="fa-solid fa-user-graduate"></i>
                        Participate
                    </a>

                    <div class="profile" id="profileBtn">
                        <i class="fa-solid fa-user"></i>
                        Profile
                    </div>

                    <div id="profileDropdown" class="dropdown">

                        <div class="user-info">
                            <p id="userName">Your Name</p>
                            <p id="userUsername">@username</p>
                            <p id="userEmail">example@email.com</p>
                        </div>

                        <hr>

                        <button id="editProfileBtn">
                            <i class="fa-solid fa-key"></i>
                             Reset Password
                        </button>

                        <button id="logoutBtn">
                            <i class="fa-solid fa-right-from-bracket"></i>
                                Logout
                        </button>

                    </div>

                </div>

            </div>

            <nav class="topbar-nav">

                <a href="dashboard.html" >
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>

                <a href="manage-event.html">
                    <i class="fa-solid fa-calendar-days"></i>
                    Manage Events
                </a>

                <a href="registrations.html" class="active">
                    <i class="fa-solid fa-users"></i>
                    Registrations
                </a>

            </nav>

        </header>

        <!-- Main -->
        <main class="manage-event">

            <section class="events-container">

                <div class="events-header">
                    <h2>All Registrations</h2>
                </div>

                <div class="toolbar">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search by Name or Registration ID"
                    >

                    <select id="eventFilter">
                        <option value="">All Events</option>
                    </select>

                </div>

                <div class="table-wrapper">
                    <table>

                        <thead>
                            <tr>
                                <th>Event</th>
                                <th>Team Name</th>
                                <th>Name</th>
                                <th>Reg. ID</th>
                                <th>Team Size</th>
                                <th>Registered On</th>
                                <th>Details</th>
                                <th>Delete</th>
                            </tr>
                        </thead>

                        <tbody id="registrationTableBody"></tbody>

                    </table>
                </div>

            </section>

            <!-- Team Details -->
            <div class="modal" id="teamModal">

                <div class="modal-content" style="width:450px;">

                    <div class="modal-header">
                        <h2>Team Details</h2>
                        <span id="closeModal">&times;</span>
                    </div>

                    <div id="teamModalBody"></div>

                </div>

            </div>

        </main>

    </div>

    <script src="../js/registrations.js"></script>
    <script src="../../profile.js"></script>

</body>

</html>
