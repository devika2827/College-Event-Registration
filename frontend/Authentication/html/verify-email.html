<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexus - Verify Email</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <main class="auth-card">

        <div class="brand">
            Nexus
        </div>

        <div class="auth-head">

            <h1 id="title">
                Verifying Email
            </h1>

            <p id="message">
                Please wait while we verify your email address...
            </p>

        </div>

        <div id="toast" class="toast"></div>

        <button
            id="loginBtn"
            class="submit-btn"
            style="display: none;"
            onclick="window.location.href='login.html'"
        >
            Go to Login
        </button>
        <p id="closeMessage" class="close-message"></p>

    </main>

    <script src="../js/verify-email.js"></script>

</body>

</html>
