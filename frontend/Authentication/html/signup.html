<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup — Campus Events</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/styles.css">

</head>

<body>

<main class="auth-card">

    <div class="brand">
        NEXUS
    </div>

    <div class="auth-head">
        <h1>Create Account</h1>
        <p>Register to continue</p>
    </div>

    <form id="signupForm">

        <div class="field">
            <div class="input-wrap">
                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required
                >
            </div>
        </div>

        <div class="field">
            <div class="input-wrap">
                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required >
            </div>
        </div>

        <div class="field">
            <div class="input-wrap">
                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required >
            </div>
        </div>

        <div class="field">
            <div class="input-wrap has-toggle">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                    minlength="6" >

                <button
                    type="button"
                    class="toggle-eye" >
                👁
                </button>

            </div>
        </div>

        <div class="field">
            <div class="input-wrap has-toggle">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required>

                <button
                    type="button"
                    class="toggle-eye"
                    data-target="confirmPassword">
                👁
                </button>

            </div>
        </div>

        <button
            type="submit"
            class="submit-btn">

        Create Account

        </button>

    </form>

    <div class="form-foot">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</main>

<script src="../js/SignUp.js"></script>

</body>
</html>
