<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexus - Reset Password</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <main class="auth-card">

        <div class="brand">
            Nexus
        </div>

        <div class="auth-head">
            <h1>Reset Password</h1>

            <p>
                Enter your new password below.
            </p>
        </div>


        <form id="forgotPasswordResetForm">

            <!-- NEW PASSWORD -->
            <div class="field">

                <div class="input-wrap has-toggle">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="New password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-eye"
                        data-target="newPassword"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                d="M2 12s3.5-7 10-7
                                10 7 10 7-3.5 7-10 7
                                -10-7-10-7Z"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            />
                        </svg>
                    </button>

                </div>

            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="field">

                <div class="input-wrap has-toggle">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-eye"
                        data-target="confirmPassword"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                d="M2 12s3.5-7 10-7
                                10 7 10 7-3.5 7-10 7
                                -10-7-10-7Z"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            />
                        </svg>
                    </button>

                </div>

            </div>

            <div
                id="message"
                class="toast"
            ></div>

            <button
                type="submit"
                id="resetBtn"
                class="submit-btn"
            >
                Reset Password
            </button>

        </form>

        <div class="form-foot">

            Remember your password?

            <a href="login.html">
                Login
            </a>

        </div>

    </main>

    <script src="../js/forgot-password-reset.js"></script>

</body>

</html>
