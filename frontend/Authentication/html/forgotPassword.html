<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | Nexus</title>

    <!-- SAME CSS USED BY LOGIN, SIGNUP AND RESET PASSWORD -->
    <link rel="stylesheet" href="styles.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <main class="auth-card">

        <!-- Brand -->
        <div class="brand">
            NEXUS
        </div>


        <!-- Heading -->
        <div class="auth-head">

            <h1>Forgot Password?</h1>

            <p>
                Enter your email address and we'll send you
                a link to reset your password.
            </p>

        </div>


        <!-- Form -->
        <form id="forgotPasswordForm">

            <div class="field">

                <div class="input-wrap">

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email address"
                        autocomplete="email"
                        required
                    >

                </div>

                <span
                    class="field-error"
                    id="emailError"
                ></span>

            </div>


            <!-- Success / Error message -->
            <div
                id="message"
                class="toast"
            ></div>


            <!-- Button -->
            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                Send Reset Link
            </button>

        </form>


        <!-- Back to login -->
        <div class="form-foot">

            Remember your password?

            <a href="login.html">
                Login
            </a>

        </div>

    </main>


    <script src="forgotPassword.js"></script>

</body>

</html>
