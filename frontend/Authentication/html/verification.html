<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nexus - Verify Your Email</title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

</head>

<body>

    <main class="auth-card">

        <div class="brand">
            Nexus
        </div>

        <div class="auth-head">

            <h1>Verify Your Email</h1>

            <p id="emailMessage">
                We've sent a verification link to your email.
            </p>

        </div>

        <div
            id="message"
            class="toast"
        ></div>

        <button
            type="button"
            id="resendBtn"
            class="submit-btn"
        >
            Resend Verification Email
        </button>

        <!-- Timer -->
        <div
            id="timerText"
            style="
                font-size: 12px;
                color: #7C8296;
                text-align: center;
                margin-top: 8px;
                min-height: 18px;
            "
        ></div>

        <div class="form-foot">

            Already verified?

            <a href="login.html">
                Login
            </a>

        </div>

    </main>

    <script src="../js/verification.js"></script>

</body>

</html>
