<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>Browse Events</title>

    <link rel="stylesheet" href="../css/style.css" >
    <link rel="stylesheet" href="../css/details.css" >

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  </head>
  <body>
    
        <!-- TopBar -->
        <header class="topbar-top">

            <div class="logo">
                <h2>Nexus</h2>
            </div>

            <div class="topbar-right">

                <a href="../../admin/html/dashboard.html" class="student-link" id="homeBtn">
                    <i class="fa-solid fa-bullhorn"></i>
                    Host
                </a>

                <a href="../html/registrations.html" class="student-link" id="homeBtn">
                    <i class="fa-solid fa-users" ></i>
                    My Registrations
                </a>

                <div class="profile-container">

                    <div class="profile" id="profileBtn">
                        <i class="fa-solid fa-user"></i>
                        Profile
                    </div>

                    <div id="profileDropdown" class="dropdown">

                        <div class="user-info">
                            <p id="userName">Your Name</p>
                            <p id="userUsername">@username</p>
                            <p id="userEmail">example@email.com</p>
                        </div>

                <hr>

                <button id="editProfileBtn">
                    <i class="fa-solid fa-key"></i>
                    Reset Password
                </button>

                <button id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </button>

                    </div>

                </div>

            </div>

        </header>

    <section class="hero">
      <h1>Browse Events</h1>
      <p>Discover exciting college events.</p>
    </section>

    <section class="controls">
      <input type="text" id="search" placeholder="Search events..." />

      <select id="category">
        <option value="All">All Categories</option>
        <option value="Technical">Technical</option>
        <option value="Workshop">Workshop</option>
        <option value="Cultural">Cultural</option>
        <option value="Sports">Sports</option>
      </select>
    </section>

    <!-- Events -->
    <section class="cards" id="cards"></section>

    <script src="../js/script.js"></script>
    <script src="../../profile.js"></script>

  </body>
</html>
