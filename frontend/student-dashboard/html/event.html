<!doctype html>

<html>
  <head>
    <meta charset="UTF-8" />

    <title>Event Details</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/details.css" />
     <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
     <header class="topbar">
        <div class="topbar-top">

            <div class="logo">
                <h2>Nexus</h2>
            </div>

            <div class="topbar-right">
              <a href="../../student-dashboard/html/index.html" class="student-link">
                        <i class="fa-solid fa-calendar"></i>
                        Events
                    </a>

                <div class="profile-container">
                  
                    <div class="profile" id="profileBtn">
                        <i class="fa-solid fa-user"></i>
                        Profile
                    </div>

                    <div id="profileDropdown" class="dropdown">

                        <div class="user-info">
                            <p id="userName">Your Name</p>
                            <p id="userUsername">@username</p>
                            <p id="userEmail">example@email.com</p>
                        </div>

                <hr>

                <button id="editProfileBtn">
                    <i class="fa-solid fa-key"></i>
                    Reset Password
                </button>
            

                <button id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </button>

                    </div>

                </div>

            </div>

        </div>
    </header>

    <div class="details">
      <img id="eventImage" />

      <h1 id="title"></h1>
      <h3 id="organizer"></h3>

      <div class="info-grid">
        <div class="info-box">
          <h3>Date</h3>

          <p id="date"></p>
        </div>

        <div class="info-box">
          <h3>Time</h3>

          <p id="time"></p>
        </div>

        <div class="info-box">
          <h3>Venue</h3>

          <p id="venue"></p>
        </div>

        <div class="info-box">
          <h3>Last Date</h3>

          <p id="lastDate"></p>
        </div>

        <div class="info-box">
          <h3>Team Size</h3>
          <p id="teamSize"></p>
        </div>

        <div class="info-box">
          <h3>Mode</h3>
          <p id="eventMode"></p>
        </div>
      </div>

      <h2>Description</h2>
      <p id="description"></p>

      <h2>Rules</h2>
      <ul id="rules"></ul>

      <button id="registerBtn">Register Now</button>
    </div>

    <script src="../js/event.js"></script>
    <script src="../../profile.js"></script>
  </body>
</html>
