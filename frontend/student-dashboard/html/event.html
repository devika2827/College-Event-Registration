<!doctype html>

<html>
  <head>
    <meta charset="UTF-8" />

    <title>Event Details</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/details.css" />
  </head>

  <body>
    <nav>
      <h2>EventHub</h2>
    </nav>

    <div class="details">
      <img id="eventImage" />

      <h1 id="title"></h1>

      <div class="info-grid">
        <div class="info-box">
          <h3>Date</h3>

          <p id="date"></p>
        </div>

        <div class="info-box">
          <h3>Time</h3>

          <p id="time"></p>
        </div>

        <div class="info-box">
          <h3>Venue</h3>

          <p id="venue"></p>
        </div>

        <div class="info-box">
          <h3>Last Date</h3>

          <p id="lastDate"></p>
        </div>

      </div>

      <h2>Description</h2>

      <p id="description"></p>

      <h2>Rules</h2>

      <ul id="rules"></ul>

      <button id="registerBtn">Register Now</button>
    </div>

    <script src="js/event.js"></script>
  </body>
</html>
